<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Treino Semanal</title>
  <meta name="description" content="Ficha de treino com timer de descanso, imagens dos exercícios, histórico de cargas e acompanhamento do peso.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <link rel="stylesheet" href="css/estilo.css">
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita piscar).
    try {
      const t = localStorage.getItem('treino-tema');
      if (t === 'claro') document.documentElement.dataset.theme = 'light';
      if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topo">
    <a class="marca" href="#/hoje">
      <img src="img/icone.svg" alt="" width="28" height="28">
      <span>Treino Semanal</span>
    </a>
    <nav class="nav" aria-label="Seções">
      <a href="#/hoje" data-pag="hoje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Hoje</span>
      </a>
      <a href="#/semana" data-pag="semana">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Semana</span>
      </a>
      <a href="#/historico" data-pag="historico">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Histórico</span>
      </a>
      <a href="#/progresso" data-pag="progresso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M5 15l4-4 3 3 6-7"/></svg>
        <span>Progresso</span>
      </a>
      <a href="#/mais" data-pag="mais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>Mais</span>
      </a>
    </nav>
    <button class="btn-timer" data-acao="timer-livre" aria-label="Abrir timer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
      <span>Timer</span>
    </button>
  </header>

  <main id="conteudo" tabindex="-1">
    <p class="carregando">Carregando…</p>
  </main>

  <div id="timer-dock" class="dock" hidden>
    <button class="dock-anel" data-acao="timer-expandir" aria-label="Expandir ou reduzir o timer">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="anel-fundo" cx="50" cy="50" r="44"/>
        <circle class="anel-progresso" cx="50" cy="50" r="44"/>
      </svg>
      <span class="dock-tempo" aria-live="off">0:00</span>
    </button>
    <div class="dock-info">
      <span class="dock-modo">Descanso</span>
      <span class="dock-rotulo"></span>
    </div>
    <div class="dock-botoes">
      <button data-acao="timer-menos" aria-label="Menos 15 segundos">−15</button>
      <button data-acao="timer-pausa" class="dock-pausa" aria-label="Pausar">❚❚</button>
      <button data-acao="timer-mais" aria-label="Mais 15 segundos">+15</button>
      <button data-acao="timer-parar" class="dock-parar">Pular</button>
    </div>
    <button class="dock-minimizar" data-acao="timer-expandir">Minimizar</button>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialogo"></dialog>

  <script src="js/dados.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/grafico.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
